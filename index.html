:9,"q":"以下哪些是 Chrome 瀏覽器的多程序架構中不同類型的程序？ - Which of the following are different types of processes in the Chrome browser's multi- process architecture?","a":"瀏覽器程序（browser process）\n渲染程序（renderer process）\n外掛程序（plug-in process）"},{"b":"行程獸原","t":"複選題","n":10,"q":"請選出訊息傳遞的佇列有三種實作的方式 - Select the three ways to implement Queue of messages attached to the link","a":"Zero capacity\nBounded capacity\nUnbounded capacity"},{"b":"行程獸原","t":"複選題","n":11,"q":"一個程序（process）包含哪些多個部分？ - What are the components of a process?","a":"程式碼（text section）\n程式計數器和暫存器（program counter and registers）\n堆疊（stack）\n堆（heap）"},{"b":"行程獸原","t":"複選題","n":12,"q":"以下哪些原因可能導致父程序終止子程序？ - Which of the following reasons might cause a parent process to terminate a child process?","a":"子程序超出分配的資源（the child process has exceeded allocated resources）\n分配給子程序的任務不再需要（the task assigned to the child process is no longer needed）\n父程序正在退出，且作業系統不允許子程序繼續（the parent process is exiting, and the operating system does not allow the child process to continue）"},{"b":"行程獸原","t":"複選題","n":13,"q":"以下哪些是命名管道（Named Pipes）的特性？ - Which of the following are characteristics of named pipes?","a":"雙向通訊（bidirectional）\n不需要有父程序與子程序關係（no parent-child relationship required）"},{"b":"行程獸原","t":"複選題","n":14,"q":"下列哪些是 Cooperating Process 的優點？／以下哪些是程序合作的理由？ - Which of the following are reasons for process cooperation?","a":"資訊共享（information sharing）\n計算加速（computation speedup）\n模組化（modularity）\n方便性（convenience）"},{"b":"行程獸原","t":"複選題","n":15,"q":"下列哪些項目與程序控制區塊（PCB）相關？ - Which of the following items are related to the Process Control Block (PCB)?","a":"程序狀態（Process State）\nCPU 暫存器（CPU Registers）\nI/O 狀態資訊（I/O Status Information）\n程式計數器（Program Counter）"},{"b":"行程獸原","t":"複選題","n":16,"q":"父程序創建子程序時，可能的資源共享選項有哪些？ - What are the possible resource-sharing options when a parent process creates a child process?","a":"父子程序共享所有資源（parent and child share all resources）\n子程序共享父程序資源的子集（child process shares a subset of the parent's resources）\n父子程序不共享資源（parent and child do not share resources）"},{"b":"行程獸原","t":"複選題","n":17,"q":"哪兩種 IPC 系統是基於訊息傳遞的？ - Which two types of IPC systems are based on messaging?","a":"Windows 的 LPC（Windows's LPC）\nMach"},{"b":"行程獸原","t":"複選題","n":18,"q":"以下哪些是通訊連結的實作問題？ - Which of the following are implementation issues for a communication link?","a":"如何建立連結（how to establish）\n一個連結是否可以與多個程序相關聯\n通訊連結的容量如何\n訊息的大小是固定的還是變動的"},{"b":"行程獸原","t":"複選題","n":19,"q":"哪些是程序之間通訊的兩種模型？ - What are the two models of communication between processes?","a":"共享記憶體（shared memory）\n訊息傳遞（message passing）"},{"b":"行程獸原","t":"複選題","n":20,"q":"訊息傳遞設施提供的兩種操作是什麼？ - What are the two operations provided by a message passing facility?","a":"發送訊息（send message）\n接收訊息（receive message）"},{"b":"行程獸原","t":"複選題","n":21,"q":"一個佇列圖可以代表什麼？ - What can a queue diagram represent?","a":"佇列（a queue）\n資源（a resource）\n流程（a process）"},{"b":"行程獸原","t":"複選題","n":22,"q":"以下哪些是作業系統中的佇列？ - Which of the following are queues in an operating system?","a":"作業佇列（job queue）\n就緒佇列（ready queue）\n設備佇列（device queue）"},{"b":"行程獸原","t":"複選題","n":23,"q":"以下哪些是 iOS 行動系統中的多工處理限制？","a":"僅允許一個前景程序（Only one foreground program is allowed.）\n允許多個背景程序（Multiple background programs are allowed.）"},{"b":"行程獸原","t":"填空題","n":1,"q":"一個程序在記憶體中被組織成多個部分，其中_____包含暫時性資料，如函式參數、回傳位址和區域變數。(請用英文縮寫回答 且用大寫字母) - A program is organized in memory into several parts, _____ of which contain temporary data such as function parameters, return addresses, and local variables.","a":"PCB"},{"b":"行程獸原","t":"填空題","n":2,"q":"一個花費大部分時間進行計算的程序被稱為_____程序。(請用小寫英文回答 單字間留一個空白) - A process that spends most of its time computing is called a _____ process.","a":"cpu bound"},{"b":"行程獸原","t":"填空題","n":3,"q":"_____抽象化了網路系統中程序之間的程序呼叫。(請用英文小寫回答，單字間留一空白)","a":"remote procedure call"},{"b":"行程獸原","t":"填空題","n":4,"q":"在 Windows 的 IPC 系統中，通訊是透過進階的_____設施進行的。(請用英文縮寫回答 且用大寫字母) - In Windows IPC systems, communication is conducted through advanced _____ facilities.","a":"LPC"},{"b":"行程獸原","t":"填空題","n":5,"q":"過程控制區塊 (PCB) 包含與每個過程相關的訊息，也稱為 _____ (請用小寫英文回答，單字間留空白) - The process control block (PCB) contains information associated with each process, also known as the _____","a":"process control block"},{"b":"行程獸原","t":"填空題","n":6,"q":"連結上沒有訊息排隊。發送方必須等待接收方的這種無空間的緩衝方式叫做_____。(請用小寫英文回答) - For a message queue, no messages are queued on a link; sender must wait for receiver. This is called _____","a":"rendezvous"},{"b":"行程獸原","t":"填空題","n":7,"q":"程序的五種狀態是：新建立（new）、執行中（running）、等待中（waiting）、就緒（ready）和_____。(請用小寫英文回答) - The five states of a process are: new, running, waiting, ready, and _____","a":"terminated"},{"b":"行程獸原","t":"填空題","n":8,"q":"在 UNIX 系統中，_____系統呼叫在 fork() 之後使用，用來將程序的記憶體空間替換為一個新程式。(請用英文小寫回答) - In UNIX systems, the _____ system call is used after fork() to replace the process's memory space with a new program.","a":"exec()"},{"b":"行程獸原","t":"填空題","n":9,"q":"在共享記憶體通訊中，主要的問題是為用戶程序提供一個機制，使其在存取共享記憶體時能夠_____其動作。(請用小寫英文回答) - In shared-memory communication, the main issue is to provide a mechanism for user processes to _____ their actions when accessing shared memory.","a":"synchronize"},{"b":"行程獸原","t":"填空題","n":10,"q":"_____充當一個通道允許兩個程序通訊。(請用小寫英文回答) - A _____ acts as a conduit that allows two processes to communicate.","a":"pipe"},{"b":"行程獸原","t":"填空題","n":11,"q":"如果父程序不呼叫 wait()，則終止的子程序會變成 _____ 程序。(請用小寫英文回答) - If a parent process does not call wait(), a terminated child process becomes a _____ process.","a":"zombie"},{"b":"行程獸原","t":"填空題","n":12,"q":"訊息傳遞中的同步化可以是_____或 non-blocking synchronous。(請用小寫英文回答，單字間留一空白) - Synchronization in message transmission can be _____ or non-blocking synchronous.","a":"blocking synchronous"},{"b":"行程獸原","t":"填空題","n":13,"q":"在 Mach IPC 系統中，訊息傳遞系統呼叫包含 msg_send()、msg_receive() 和 _____。(請用小寫英文作答) - In the Mach IPC system, the message passing system calls include msg_send(), msg_receive(), and _____.","a":"msg_rpc()"},{"b":"行程獸原","t":"填空題","n":14,"q":"普通管道(ordinary pipe)是_____的，並且要求通訊程序之間有親子關係。(請用小寫英文回答) - Ordinary pipes are _____ and require a parent-child relationship between communicating processes.","a":"unidirectional"},{"b":"行程獸原","t":"填空題","n":15,"q":"具名管道(named pipe)比普通管道(ordinary pipe)更強大，因為其通訊是_____的，且不需要親子關係。 - Named pipes are more powerful than ordinary pipes because their communication is _____ and does not require parent-child relationships.","a":"bidirectional"},{"b":"行程獸原","t":"填空題","n":16,"q":"在遠端程序呼叫 (RPC) 中，_____是伺服器上實際程序的客戶端代理。 - In remote procedure calls (RPC), _____ are the client proxy of the actual procedure on the server.","a":"stubs"},{"b":"行程獸原","t":"填空題","n":17,"q":"iOS 行動系統提供一個單一的_____程序，通過用戶介面進行控制。 - The iOS mobile system provides a single _____ process that is controlled through a user interface.","a":"foreground"},{"b":"行程獸原","t":"填空題","n":18,"q":"CPU 在程序之間切換時，必須儲存舊程序的狀態並載入新程序的儲存狀態，這被稱為_____。 - When the CPU switches between processes, it must save the state of the old process and load the saved state of the new process, a procedure known as a _____.","a":"context switch"},{"b":"行程獸原","t":"填空題","n":19,"q":"一個_____被定義為通訊的端點，由 IP 位址和連接埠的組合而成。 - A(n) _____ is defined as a communication endpoint, consisting of a combination of an IP address and a port.","a":"socket"},{"b":"行程獸原","t":"填空題","n":20,"q":"長期排程器控制_____的程度，該名詞指的是在記憶體中同時存在的程序數量。 - The long-term scheduler controls the degree of _____, which refers to the number of processes existing in memory at the same time.","a":"Multiprogramming"},{"b":"行程獸原","t":"填空題","n":21,"q":"中期排程器可以將一個程序從記憶體中移除並存儲到磁碟上，然後再將其帶回，這個過程稱為 - _____。 A mid-term scheduler can remove a process from memory and store it on a disk, and then bring it back; this process is called _____.","a":"swapping"},{"b":"行程獸原","t":"填空題","n":22,"q":"如果一個子程序在父程序終止後仍然存在,且父程序未呼叫 wait(),這會導致該子程序成為一個_____程序。 - If a parent process does not call wait(), a terminated child process becomes a _____process.","a":"orphan"},{"b":"行程獸原","t":"填空題","n":23,"q":"_____問題是合作程序的一種範式，其中一個程序產生資訊，而另一個程序消耗該資訊。(請用小寫英文回答，單字間用 - 連接) - The _____ problem is a paradigm for cooperating processes, in which one process produces information and another process consumes that information.","a":"producer-consumer"},{"b":"執行緒山","t":"單選題","n":1,"q":"執行緒取消（Thread Cancellation）的兩種方法中，哪一種會立即終止目標執行緒？ - Of the two methods of thread cancellation, which one immediately terminates the target thread?","a":"異步取消 (Asynchronous cancellation)"},{"b":"執行緒山","t":"單選題","n":2,"q":"下列哪一個不是主要的使用者層級執行緒函式庫？ - Which of the following is not a major user-level thread library?","a":"Android threads"},{"b":"執行緒山","t":"單選題","n":3,"q":"Java 執行緒通常由誰管理？ - Who typically manages Java threads?","a":"Java 虛擬機 (JVM) - Java Virtual Machine (JVM)"},{"b":"執行緒山","t":"單選題","n":4,"q":"在 Windows 系統中，每個執行緒的「上下文 (context)」不包含下列哪一項？ - In the Windows system, which of the following is not included in each thread's \"context\"?","a":"其他程序執行緒的 - ID（IDs of other process threads）"},{"b":"執行緒山","t":"單選題","n":5,"q":"在多核心程式設計中，將相同資料集的子集分配到多個核心上，並在每個核心上執行相同操作，是哪一種類型的平行處理？ - In multicore programming, what type of parallelism involves distributing subsets of the same data across multiple cores and performing the same operation on each core?","a":"資料平行 (Data parallelism)"},{"b":"執行緒山","t":"單選題","n":6,"q":"多執行緒伺服器架構中，當一個客戶端請求到達時，伺服器會做什麼？ - In a multithreaded server architecture, what does the server do when a client request arrives?","a":"創建一個新執行緒來服務請求 (Create a new thread to service the request)"},{"b":"執行緒山","t":"單選題","n":7,"q":"哪一種多執行緒模型將多個使用者層級執行緒映射到單一核心執行緒？ - Which multithreading model maps multiple user-level threads to a single kernel thread?","a":"Many-to-One"},{"b":"執行緒山","t":"單選題","n":8,"q":"POSIX Pthreads 是什麼？ - What is POSIX Pthreads?","a":"一個用於執行緒創建和同步的 API 標準 (An API standard for thread creation and synchronization)"},{"b":"執行緒山","t":"單選題","n":9,"q":"下列哪一個作業系統的執行緒實作採用 One-to-One 模型？ - Which of the following operating systems implements the One-to-One model for threads?","a":"Windows NT/XP/2000"},{"b":"執行緒山","t":"單選題","n":10,"q":"多執行緒程式設計的好處中，下列哪一項與使用者介面特別相關？ - Among the benefits of multithreaded programming, which one is particularly relevant to user interfaces?","a":"響應性 (Responsiveness)"},{"b":"執行緒山","t":"單選題","n":11,"q":"執行緒 (Thread) 與程序 (Process) 相比，其創建成本有何不同？ - How does the creation cost of a thread compare to that of a process?","a":"執行緒創建是輕量級的 (Thread creation is lightweight)"},{"b":"執行緒山","t":"單選題","n":12,"q":"執行緒本地儲存 (Thread-local storage, TLS) 有何用途？ - What is the purpose of Thread-local storage (TLS)?","a":"允許每個執行緒擁有自己的資料副本 (Allows each thread to have its own copy of data)"},{"b":"執行緒山","t":"單選題","n":13,"q":"下列何者是多執行緒程式設計的一個優點？ - Which of the following is an advantage of multithreaded programming?","a":"簡化程式碼並提高效率 (Simplifies code and improves efficiency)"},{"b":"執行緒山","t":"單選題","n":14,"q":"使用者層級執行緒 (User-level threads) 的管理主要由誰負責？ - Who is primarily responsible for managing user-level threads?","a":"使用者層級執行緒函式庫 (User-level thread library)"},{"b":"執行緒山","t":"單選題","n":15,"q":"哪一種多執行緒模型為每個使用者層級執行緒映射一個核心執行緒？ - Which multithreading model maps one kernel thread for each user-level thread?","a":"One-to-One"},{"b":"執行緒山","t":"單選題","n":16,"q":"Amdahl's Law 主要用來識別什麼樣的效能提升？ - What kind of performance gain is Amdahl's Law primarily used to identify?","a":"增加額外核心所帶來的效能提升 (Performance gain from adding extra cores)"},{"b":"執行緒山","t":"單選題","n":17,"q":"OpenMP 主要提供在哪種環境下進行平行程式設計的支援？ - In what environment does OpenMP primarily provide support for parallel programming?","a":"共享記憶體環境 (Shared-memory environment)"},{"b":"執行緒山","t":"單選題","n":18,"q":"Linux 創建執行緒的系統呼叫是什麼？ - What is the Linux system call for creating a thread?","a":"clone()"},{"b":"執行緒山","t":"單選題","n":19,"q":"下列哪一個不是隱式執行緒 (Implicit Threading) 的方法？ - Which of the following is not a method of implicit threading?","a":"pthread_create()"},{"b":"執行緒山","t":"單選題","n":20,"q":"在多處理器架構中，利用多個處理器核心的優點是什麼？ - In a multiprocessor architecture, what is the advantage of utilizing multiple processor cores?","a":"可擴展性 (Scalability)"},{"b":"執行緒山","t":"單選題","n":21,"q":"Grand Central Dispatch 是由哪家公司開發的技術？ - Which company developed the Grand Central Dispatch technology?","a":"Apple"},{"b":"執行緒山","t":"複選題","n":1,"q":"在多核心系統中進行程式設計時，可能遇到的挑戰包括？ - What are some of the challenges you might encounter when programming for multicore systems?","a":"分割活動 (Dividing activities)\n測試與除錯 (Testing and debugging)\n資料相依性 (Data dependency)"},{"b":"執行緒山","t":"複選題","n":2,"q":"在 Windows 執行緒的資料結構中，使用者空間（user space）包含哪些區塊？ - In the Windows thread data structure, what blocks are contained in user space?","a":"執行緒本地儲存 (Thread-local storage)\nTEB"},{"b":"執行緒山","t":"複選題","n":3,"q":"在 Windows 執行緒的資料結構中，核心空間（kernel space）包含哪些區塊？ - In the Windows thread data structure, what blocks are contained in kernel space?","a":"ETHREAD\nKTHREAD"},{"b":"執行緒山","t":"複選題","n":4,"q":"單執行緒程序和多執行緒程序共享哪些資源？ - What resources are shared by single-threaded processes and multithreaded processes?","a":"程式碼 (Program code)\n資料 (Data)\n檔案 (Files)"},{"b":"執行緒山","t":"複選題","n":5,"q":"執行緒池（Thread Pools）的優點包括哪些？ - What are the advantages of Thread Pools?","a":"使用現有執行緒服務請求比創建新執行緒更快\n允許應用程式中的執行緒數量被限制在池的大小\n將任務與創建任務的機制分離\nUsing existing threads to service requests is faster than creating new threads\nAllows the number of threads in the application to be limited to the size of the pool\nSeparates the task from the mechanism that creates the task"},{"b":"執行緒山","t":"複選題","n":6,"q":"哪一種多執行緒模型允許一個核心執行緒與一個使用者執行緒綁定？ - Which multithreading model allows binding a user thread to a kernel thread?","a":"Many-to-One\nOne-to-One\nMany-to-Many\nTwo-level"},{"b":"執行緒山","t":"複選題","n":7,"q":"多執行緒伺服器架構的優點包含哪些？ - What are the advantages of a multithreaded server architecture?","a":"伺服器可以同時服務多個客戶端請求\n當一個執行緒被阻塞時，其他執行緒可以繼續執行\n執行緒創建比程序創建更輕量級\nThe server can service multiple client requests simultaneously\nWhen one thread is blocked, other threads can continue to run\nThread creation is more lightweight than process creation"},{"b":"執行緒山","t":"複選題","n":8,"q":"在 Linux 系統中，關於執行緒的敘述哪些是正確的？ - Which of the following statements about threads in the Linux system are correct?","a":"Linux 將執行緒稱為任務\n執行緒創建是透過 clone() 系統呼叫完成\nclone() 允許子任務與父任務共享位址空間\nLinux refers to threads as tasks\nThread creation is done via the clone() system call\nclone() allows child tasks to share the parent's address space"},{"b":"執行緒山","t":"複選題","n":9,"q":"延遲取消（Deferred cancellation）有何特性？ - What are the characteristics of deferred cancellation?","a":"允許目標執行緒定期檢查是否應被取消\n只有當執行緒到達取消點時才會發生取消\n屬於 Pthread 的預設取消類型"},{"b":"執行緒山","t":"複選題","n":10,"q":"隱式執行緒（Implicit Threading）的優勢在於？ - What are the advantages of Implicit Threading?","a":"減少程式設計師管理執行緒的負擔\n創建和管理執行緒由編譯器和執行時期函式庫完成\n有助於解決執行緒數量增加時的程式正確性問題"},{"b":"執行緒山","t":"複選題","n":11,"q":"在 Java 中，創建執行緒的方法有哪兩種？ - In Java, what are the two methods for creating a thread?","a":"繼承 Thread 類別 (Inheriting the Thread class)\n實作 Runnable 介面 (Implementing the Runnable interface)"},{"b":"執行緒山","t":"複選題","n":12,"q":"OpenMP 提供哪些特性來支援平行程式設計？ - What characteristics does OpenMP provide to support parallel programming?","a":"一組編譯器指令和 API\n在共享記憶體環境中支援平行程式設計\n允許程式設計師明確標識平行區域\nA set of compiler directives and APIs\nSupports parallel programming in a shared-memory environment\nAllows programmers to explicitly identify parallel regions"},{"b":"執行緒山","t":"複選題","n":13,"q":"執行緒本地儲存（Thread-local storage, TLS）與區域變數有何不同？ - How does Thread-local storage (TLS) differ from local variables?","a":"TLS 在多次函式呼叫中可見\n區域變數只在單次函式呼叫中可見"},{"b":"執行緒山","t":"複選題","n":14,"q":"多執行緒程式設計的好處包含哪些？ - What are the benefits of multithreaded programming?","a":"響應性 (Responsiveness)\n資源共享 (Resource sharing)\n經濟性 (Economy)\n可擴展性 (Scalability)"},{"b":"執行緒山","t":"複選題","n":15,"q":"下列關於平行性與並行性的敘述，哪些是正確的？ - Which of the following statements about Parallelism and Concurrency are correct?","a":"平行性意指一個系統可以同時執行多個任務\n並行性意指一個系統可以支援多個任務同時進展\n單核心系統可以提供並行性\n多核心系統可以提供平行性\nParallelism means a system can execute more than one task simultaneously\nConcurrency means a system can support the progression of more than one task at\nthe same time\nA single-core system can provide concurrency\nA multicore system can provide parallelism"},{"b":"執行緒山","t":"複選題","n":16,"q":"下列哪些作業系統採用 One-to-One 模型？ - Which of the following operating systems use the One-to-One model?","a":"Solaris 9 和更高版本 (Solaris 9 and higher)\nWindows NT/XP/2000\nLinux"},{"b":"執行緒山","t":"複選題","n":17,"q":"下列關於 fork() 和 exec() 系統呼叫在多執行緒環境下的語義描述，哪些是正確的？ - Which of the following statements describing the semantics of fork() and exec() system calls in a multithreaded environment are correct?","a":"fork() 有時只複製呼叫執行緒\nfork() 有時會複製所有執行緒\nexec() 通常會替換整個正在運行的程序，包括所有執行緒"},{"b":"執行緒山","t":"複選題","n":18,"q":"One-to-One 模型有何特性？ - What are the characteristics of the One-to-One model?","a":"每個使用者層級執行緒映射到一個核心執行緒\n創建使用者層級執行緒會創建一個核心執行緒\n比 Many-to-One 模型提供更多的並行性\n程序中執行緒數量有時會因為開銷而受限\nEach user-level thread maps to one kernel thread\nCreating a user-level thread creates a kernel thread\nProvides more concurrency than the Many-to-One model\nThe number of threads in a process can sometimes be limited by overhead"},{"b":"執行緒山","t":"複選題","n":19,"q":"Many-to-One 模型具有哪些特性？ - What are the characteristics of the Many-to-One model?","a":"多個使用者層級執行緒映射到單一核心執行緒\n一個執行緒被阻塞會導致所有執行緒被阻塞\n多個執行緒無法在多核心系統上平行運行\nMultiple user-level threads are mapped to a single kernel thread\nThe blocking of one thread blocks all threads\nMultiple threads cannot run in parallel on a multicore system"},{"b":"執行緒山","t":"複選題","n":20,"q":"下列哪些屬於使用者層級執行緒函式庫？ - Which of the following are user-level thread libraries?","a":"POSIX Pthreads\nWin32 threads\nJava threads"},{"b":"執行緒山","t":"複選題","n":21,"q":"在多執行緒環境中，處理信號的方式可以有哪幾種？ - What are the ways to handle signals in a multithreaded environment?","a":"將信號傳遞給應用該信號的特定執行緒\n將信號傳遞給程序中的每個執行緒\n將信號傳遞給程序中的某些特定執行緒\n指定一個特定執行緒來接收所有信號"},{"b":"執行緒山","t":"填空題","n":1,"q":"_____指將相同資料集的子集分配到多個核心上，並在每個核心上執行相同的操作。 - _____ refers to the distribution of subsets of the same data set to multiple cores, with the same operation being performed on each core","a":"data parallelism"},{"b":"執行緒山","t":"填空題","n":2,"q":"_____指將執行緒分配到不同的核心上，每個執行緒執行獨特的任務。 - _____ refers to the distribution of threads to different cores, with each thread executing a unique task","a":"task parallelism"},{"b":"執行緒山","t":"填空題","n":3,"q":"_____技術的流行，是因為當執行緒數量增加時，程式的正確性變得更難以確保。 - The popularity of _____ techniques is due to the difficulty of ensuring program correctness as the number of threads increases","a":"implicit threading"},{"b":"執行緒山","t":"填空題","n":4,"q":"在 _____ 模型中，多個使用者層級執行緒映射到單一核心執行緒。 - In the _____ model, many user-level threads are mapped to a single kernel thread","a":"many-to-one"},{"b":"執行緒山","t":"填空題","n":5,"q":"在 _____ 模型中，許多使用者層級執行緒可以被映射到許多核心執行緒。 - In the _____ model, many user-level threads can be mapped to many kernel threads","a":"many-to-many"},{"b":"執行緒山","t":"填空題","n":6,"q":"在 _____ 模型中，每個使用者層級執行緒映射到一個核心執行緒。 - In the _____ model, each user-level thread is mapped to one kernel thread","a":"one-to-one"},{"b":"執行緒山","t":"填空題","n":7,"q":"Windows 執行緒實作了 _____ 模型。 - Windows threads implement the _____ model","a":"one-to-one"},{"b":"執行緒山","t":"填空題","n":8,"q":"由於執行緒共用程序的資源，因此 _____ 比共享記憶體或訊息傳遞更容易實現。 - Because threads share a process's resources, _____ is easier to achieve than shared memory or message passing","a":"resource sharing"},{"b":"執行緒山","t":"填空題","n":9,"q":"多執行緒應用程式的優點之一是 _____，因為即使程序的一部分被阻塞，程式碼也能繼續執行。 - One of the advantages of multithreaded applications is _____, as code can continue to run even if part of the process is blocked","a":"responsiveness"},{"b":"執行緒山","t":"填空題","n":10,"q":"_____是指一個系統可以同時執行一個以上的任務。 - _____ refers to a system's ability to execute more than one task simultaneously","a":"parallelism"},{"b":"執行緒山","t":"填空題","n":11,"q":"_____是指一個系統可以支援一個以上的任務同時取得進展。 - _____ means a system can support the progression of more than one task at the same time","a":"concurrency"},{"b":"執行緒山","t":"填空題","n":12,"q":"有三種主要的使用者層級執行緒函式庫：POSIX Pthreads、Win32 threads 和 _____。 - There are three major user-level thread libraries: POSIX Pthreads, Win32 threads, and _____","a":"java threads"},{"b":"執行緒山","t":"填空題","n":13,"q":"Amdahl's Law 的公式為：speedup <= 1/(S+(1-S)/N)，其中 S 代表應用程式的 _____ 部分。 - Amdahl's Law is formulated as: speedup = 1/(S+(1-S)/N), where S represents the _____ of the application","a":"serial portion"},{"b":"執行緒山","t":"填空題","n":14,"q":"Amdahl's Law 的公式為：speedup <= 1/(S+(1-S)/N)，N 代表 _____ 的數量。 - Amdahl's Law is formulated as: speedup = 1/(S+(1-S)/N), where N represents the number of _____","a":"processing cores"},{"b":"執行緒山","t":"填空題","n":15,"q":"_____是一種終止執行緒的方法，它允許目標執行緒定期檢查是否應被取消。 - _____ is a method for terminating a thread that allows the target thread to periodically check whether it should be canceled","a":"deferred cancellation"},{"b":"執行緒山","t":"填空題","n":16,"q":"_____是 CPU 利用率的基本單位，也是多執行緒電腦系統的基礎。 - _____ is the basic unit of CPU utilization and the foundation of multithreaded computer systems","a":"thread"},{"b":"執行緒山","t":"填空題","n":17,"q":"_____允許每個執行緒擁有自己的資料副本。 - _____ allows each thread to have its own copy of data","a":"thread local storage"},{"b":"執行緒山","t":"填空題","n":18,"q":"_____是一個 Apple 的技術，用於 Mac OS X 和 iOS 作業系統，允許識別平行區域並管理執行緒的細節。 - _____ is an Apple technology used in the Mac OS X and iOS operating systems that allows for the identification of parallel regions and management of thread details","a":"grand central dispatch"},{"b":"執行緒山","t":"填空題","n":19,"q":"_____用於在 UNIX 系統中通知程序發生特定事件。 - _____ are used in UNIX systems to notify a process that a specific event has occurred","a":"signals"},{"b":"執行緒山","t":"填空題","n":20,"q":"創建執行緒的成本比程序 (process) 少，且執行緒切換的開銷也低於 _____。 - The cost of creating a thread is less than a process, and the overhead of a thread switch is also lower than a _____","a":"context switch"},{"b":"執行緒山","t":"填空題","n":21,"q":"在 _____ 模型中，會創建一定數量的執行緒，並將其放置在池中等待工作。 - In the _____ model, a number of threads are created and placed into a pool where they wait for work","a":"thread pools"},{"b":"行程排程谷","t":"單選題","n":1,"q":"短剩餘時間優先（SRTF）是哪一種排程演算法的搶佔式版本？ - Shortest-remaining-time-first (SRTF) is the preemptive version of which scheduling algorithm?","a":"短工作優先（SJF） - Shortest-Job-First (SJF)"},{"b":"行程排程谷","t":"單選題","n":2,"q":"在多處理器系統中，哪種方法僅有一個處理器負責存取系統資料結構？ - In a multiprocessor system, which approach involves only one processor accessing the system data structures?","a":"非對稱多處理 - Asymmetric multiprocessing"},{"b":"行程排程谷","t":"單選題","n":3,"q":"哪一個排程演算法會導致「護航效應」（convoy effect）？ - Which scheduling algorithm can lead to the 'convoy effect'?","a":"先到先服務（FCFS） - First-Come, First-Served (FCFS)"},{"b":"行程排程谷","t":"單選題","n":4,"q":"在 Linux 核心版本 2.6.23 之後，主要的排程器演算法是什麼？ - After Linux kernel version 2.6.23, what is the main scheduling algorithm?","a":"完全公平排程器（CFS） - Completely Fair Scheduler (CFS)"},{"b":"行程排程谷","t":"單選題","n":5,"q":"在優先權排程中，什麼問題可能導致低優先權程序永遠無法執行？ - In priority scheduling, what problem can cause low-priority processes to never execute?","a":"飢餓（Starvation） - Starvation"},{"b":"行程排程谷","t":"單選題","n":6,"q":"從中斷到達的時間到服務該中斷的函式(ISR)開始執行的時間，這段時間被稱為？ - The time from the arrival of an interrupt to the start of the routine that services the interrupt is called?","a":"中斷延遲 - Interrupt latency"},{"b":"行程排程谷","t":"單選題","n":7,"q":"在 Windows 排程中，哪個功能允許應用程式獨立於核心來創建和管理執行緒？ - In Windows scheduling, what feature allows applications to create and manage threads independently of the kernel?","a":"使用者模式排程（UMS） - User-mode scheduling (UMS)"},{"b":"行程排程谷","t":"單選題","n":8,"q":"在 Solaris 作業系統中，預設的排程類別是什麼？ - In the Solaris operating system, what is the default scheduling class?","a":"時程共享（Time Sharing） - Time Sharing"},{"b":"行程排程谷","t":"單選題","n":9,"q":"什麼是 Little's Formula (n = λ x W) 中的 n？ - In Little's Formula (n = λ x W), what does n represent?","a":"平均佇列長度 - Average queue length"},{"b":"行程排程谷","t":"單選題","n":10,"q":"哪一個排程演算法被認為是最佳的，因為它能提供給定程序集的最小平均等待時間？ - Which scheduling algorithm is considered optimal because it provides the minimum average waiting time for a given set of processes?","a":"短工作優先（SJF） - Shortest-Job-First (SJF)"},{"b":"行程排程谷","t":"單選題","n":11,"q":"在 POSIX 即時排程中，SCHED_FIFO 的特點是什麼？ - What is a characteristic of SCHED_FIFO in POSIX real-time scheduling?","a":"沒有時間分片 - There is no time-slicing"},{"b":"行程排程谷","t":"單選題","n":12,"q":"在 Windows 排程中，哪個優先權類別的程序不能被提升優先權？ - In Windows scheduling, which priority class of processes cannot have its priority boosted?","a":"REALTIME_PRIORITY_CLASS"},{"b":"行程排程谷","t":"單選題","n":13,"q":"迴圈排程（RR）演算法中，每個程序獲得一小段 CPU 時間的單位稱為？ - In the Round Robin (RR) scheduling algorithm, what is the unit of a small amount of CPU time given to each process?","a":"時間片（Time quantum） - Time quantum"},{"b":"行程排程谷","t":"單選題","n":14,"q":"當迴圈排程（RR）中的時間片（q）非常大時，該演算法的行為會趨近於哪種排程？ - When the time quantum (q) in Round Robin (RR) is very large, the algorithm's behavior approaches which scheduling type?","a":"先到先服務（FCFS） - First-Come, First-Served (FCFS)"},{"b":"行程排程谷","t":"單選題","n":15,"q":"CPU 排程的核心目標是什麼？ - What is the core objective of CPU scheduling?","a":"最大化 CPU 利用率 - Maximize CPU utilization"},{"b":"行程排程谷","t":"單選題","n":16,"q":"在多層級回饋佇列（Multilevel Feedback Queue）排程中，老化（aging）是如何實現的？ - How is aging implemented in Multilevel Feedback Queue scheduling?","a":"通過讓程序在佇列之間移動 - By allowing a process to move between queues"},{"b":"行程排程谷","t":"單選題","n":17,"q":"在 Windows 系統中，當一個執行緒的時限（quantum）用完後，它的優先權會如何？ - In the Windows system, what happens to a thread's priority when its quantum expires?","a":"降低 - It is lowered"},{"b":"行程排程谷","t":"單選題","n":18,"q":"硬即時系統（Hard real-time systems）的重要特性是什麼？ - What is a key characteristic of hard real-time systems?","a":"任務必須在截止時間內完成 - A task must be serviced by its deadline"},{"b":"行程排程谷","t":"單選題","n":19,"q":"在多核心處理器中，利用記憶體停頓時間來推進另一個執行緒的技術是什麼？ - In multicore processors, what technique takes advantage of memory stall to make progress on another thread?","a":"多執行緒多核心系統 - Multithreaded multicore system"},{"b":"行程排程谷","t":"單選題","n":20,"q":"下列哪一項是分派器（Dispatcher）的工作？ - Which of the following is a task of the Dispatcher?","a":"將 CPU 控制權交給排程器選擇的程序 - Giving control of the CPU to the process - selected by the scheduler"},{"b":"行程排程谷","t":"單選題","n":21,"q":"分派延遲（Dispatch latency）指的是什麼？ - What is ust be completed within their deadline\nInterrupt latency can affect performance\nDispatch latency can affect performance"},{"b":"行程排程谷","t":"複選題","n":15,"q":"在多處理器系統中，下列哪些排程方法屬於負載平衡？ - In a multiprocessor system, which of the following scheduling methods are part of load balancing?","a":"推動式遷移（Push migration）\n拉取式遷移（Pull migration）"},{"b":"行程排程谷","t":"複選題","n":16,"q":"在 Solaris 排程中，當多個執行緒具有相同的最高優先權時，排程器會如何處理？ - In Solaris scheduling, how does the scheduler handle multiple threads with the same highest priority?","a":"採用迴圈排程\nIt uses Round Robin scheduling"},{"b":"行程排程谷","t":"複選題","n":17,"q":"POSIX 即時排程標準中定義了哪些排程類別？ - Which scheduling classes are defined in the POSIX real-time scheduling standard?","a":"SCHED_FIFO\nSCHED_RR"},{"b":"行程排程谷","t":"複選題","n":18,"q":"短工作優先（SJF）排程的優點包含哪些？ - What are the advantages of Shortest-Job-First (SJF) scheduling?","a":"給定程序集的最小平均等待時間\nMinimum average waiting time for a given set of processes"},{"b":"行程排程谷","t":"複選題","n":19,"q":"下列哪些關於即時排程的敘述是正確的？ - Which of the following statements about real-time scheduling are correct?","a":"排程器必須支援搶佔式、基於優先權的排程\n硬即時系統必須提供滿足截止日期的能力\n週期性任務的速率是其週期的倒數\nScheduler must support preemptive, priority-based scheduling\nHard real-time systems must provide deadline satisfaction\nRate of a periodic task is the inverse of its period"},{"b":"行程排程谷","t":"複選題","n":20,"q":"Windows 中，下列哪些是可變（Variable）優先權類別？ - In Windows, which of the following are Variable priority classes?","a":"HIGH_PRIORITY_CLASS\nNORMAL_PRIORITY_CLASS\nIDLE_PRIORITY_CLASS"},{"b":"行程排程谷","t":"複選題","n":21,"q":"下列哪些是排程演算法的優化目標？ - Which of the following are optimization goals for scheduling algorithms?","a":"最大化 CPU 利用率\n最小化周轉時間\n最大化吞吐量\n最小化回應時間\nMaximize CPU utilization\nMinimize turnaround time\nMaximize throughput\nMinimize response time"},{"b":"行程排程谷","t":"複選題","n":22,"q":"佇列模型（Queueing models）通常用來計算哪些平均值？ - What averages are typically computed using queueing models?","a":"平均吞吐量\n平均利用率\n平均等待時間\nAverage throughput\nAverage utilization\nAverage wai 那麼地址綁定必須在哪個時間發生？ - If a process can be moved during its execution, at what time must address binding occur?","a":"執行時間 (Execution Time)"},{"b":"記憶體沼澤","t":"單選題","n":13,"q":"分段 (Segmentation) 記憶體管理中，程式的邏輯地址由哪兩部分組成？ - In Segmentation memory management, which two parts compose the program's logical address?","a":"Segment & Offset"},{"b":"記憶體沼澤","t":"單選題","n":14,"q":"哪個頁表結構在整個系統中只有一個頁表，且每個條目對應一個物理幀？ - Which page table structure has only one page table for the entire system, where each entry corresponds to a physical frame?","a":"倒置頁表 (Inverted Page Table)"},{"b":"記憶體沼澤","t":"單選題","n":15,"q":"哪個硬體單元用於將邏輯地址轉換為物理地址？ - Which hardware unit is used for mapping logical addresses to physical addresses?","a":"MMU (Memory Management Unit)"},{"b":"記憶體沼澤","t":"單選題","n":16,"q":"哪種記憶體分配策略會導致 內部碎片？ - Which memory allocation strategy leads to Internal Fragmentation?","a":"分頁 (Paging)"},{"b":"記憶體沼澤","t":"單選題","n":17,"q":"交換 (Swapping) 機制中，主記憶體中的程序會被移到哪個儲存設備？ - In the Swapping mechanism, where is a process in main memory moved to?","a":"後備儲存 (Backing Store)"},{"b":"記憶體沼澤","t":"單選題","n":18,"q":"哪個記憶體管理技術將程式視為一組邏輯單元？ - Which memory management technique views a program as a collection of logical units?","a":"分段 (Segmentation)"},{"b":"記憶體沼澤","t":"單選題","n":19,"q":"ARM 架構中，通常使用哪些大小的頁面 (Pages)？ - What page sizes are typically used in the ARM architecture?","a":"4KB 和 16KB - 4 KB and 16 KB"},{"b":"記憶體沼澤","t":"單選題","n":20,"q":"在分層分頁 (Hierarchical Paging) 中，頁表本身被如何處理？ - In Hierarchical Paging, how is the page table itself handled?","a":"進行分頁 - It is paged"},{"b":"記憶體沼澤","t":"單選題","n":21,"q":"在分頁中，當分配給程序的一塊記憶體大於所需時，造成的浪費稱為？ - In paging, what is the waste called when the memory block allocated to a process is larger than needed?","a":"內部碎片 (Internal Fragmentation)"},{"b":"記憶體沼澤","t":"單選題","n":22,"q":"在分頁中，邏輯地址的哪個部分用於作為頁表的索引？ - In paging, which part of the logical address is used as the index into the page table?","a":"頁號 (Page Number)"},{"b":"記憶體沼澤","t":"單選題","n":23,"q":"如果地址綁定發生在編譯時期，會產生哪種類型的程式碼？ - If address binding occurs at compile time, what type of code is generated?","a":"絕對程式碼 (Absolute Code)"},{"b":"記憶體沼澤","t":"單選題","n":24,"q":"外部碎片是哪種記憶體分配技術的主要缺點？ - External fragmentation is a primary disadvantage of which memory allocation technique?","a":"連續分配 (Contiguous Allocation)"},{"b":"記憶體沼澤","t":"複選題","n":1,"q":"交換 (Swapping) 機制的主要成本包括哪些？ - What are the main costs associated with the Swapping mechanism?","a":"將程序從後備儲存傳輸到記憶體的時間\n上下文切換的時間開銷\n將程序從記憶體傳輸到後備儲存的時間\nTime to transfer the process from backing store to memory\nTime overhead of context switching\nTime to transfer the process from memory to backing store"},{"b":"記憶體沼澤","t":"複選題","n":2,"q":"哪些是記憶體保護 (Protection of Memory) 的目標？ - What are the goals of Memory Protection?","a":"確保作業系統不受使用者程序影響\n確保使用者程序之間互不影響\n確保程式執行的正確性\nTo ensure user processes do not affect each other\nTo ensure the OS is not affected by user processes\nTo ensure the correct operation of programs"},{"b":"記憶體沼澤","t":"複選題","n":3,"q":"連續記憶體分配中，下列哪些是記憶體碎片 (Fragmentation) 的類型？ - In contiguous memory allocation, which of the following are types of memory fragmentation?","a":"外部碎片 (External Fragmentation)\n內部碎片 (Internal Fragmentation)"},{"b":"記憶體沼澤","t":"複選題","n":4,"q":"在 倒置頁表 (Inverted Page Table) 中，尋找所需條目需要哪些資訊？ - In an Inverted Page Table, which pieces of information are needed to search for the required entry?","a":"程序 ID (Process ID)\n虛擬地址的頁號 (Page Number of Virtual Address)"},{"b":"記憶體沼澤","t":"複選題","n":5,"q":"分段 (Segmentation) 記憶體管理中，段表 (Segment Table) 的每個條目包含哪些資訊？ - In Segmentation memory management, which information is contained in each entry of the Segment Table?","a":"基底地址 (Base Address)\n限制 (Limit)\n保護位元 (Protection Bits)"},{"b":"記憶體沼澤","t":"複選題","n":6,"q":"哪些是分層分頁 (Hierarchical Paging) 的特點？ - What are the characteristics of Hierarchical Paging?","a":"允許頁表本身被分頁\n用來處理大的虛擬地址空間\n邏輯地址被分為多個部分 (例如：兩個頁號和一個偏移量)\nAllows the page table itself to be paged\nUsed to handle large virtual address spaces\nThe logical address is divided into multiple function tg(el){var key=el.dataset.k;if(M.has(key))M.delete(key);else M.add(key);save();if(fs){render();return}el.classList.toggle('on');el.textContent=M.has(key)?'★':'☆';el.setAttribute('aria-pressed',M.has(key));updMk()}
function blk(c,vis,h,lab){return '<div class="'+c+(vis?'':' hid')+'" tabindex="0" role="button" data-l="'+lab+'" data-h="'+h.replace(/"/g,'&quot;')+'" onclick="rv(this)" onkeydown="if(event.key===\'Enter\')rv(this)">'+(vis?h:lab)+'</div>'}
function qh(q){var i=-1,p=0,z=/[\u3400-\u9fff]/;while((p=q.indexOf(' - ',p))>-1){if(z.test(q.slice(0,p))&&!z.test(q.slice(p+3))){i=p;break}p+=3}return i<0?hl(q):hl(q.slice(0,i))+'<div class="sep"></div>'+hl(q.slice(i+3))}
function ml(a){var L=a.split('\n'),k=-1;L.forEach((l,i)=>{if(/[\u3400-\u9fff]/.test(l))k=i});return L.map((l,i)=>'<div>• '+hl(l)+'</div>'+(i===k&&i<L.length-1?'<div class="sep"></div>':'')).join('')}
function rv(el){var s=el.classList.contains('hid');el.classList.toggle('hid');el.innerHTML=s?el.dataset.h:el.dataset.l}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hl(s){s=esc(s);if(!term)return s;return s.replace(new RegExp('('+rx(esc(term))+')','gi'),'<mark>$1</mark>')}
function mk(box,arr,set){arr.forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent=v;b.setAttribute('aria-pressed','false');b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.setAttribute('aria-pressed',set.has(v));render()};box.appendChild(b)})}
function dd(box,name,arr,set){
arr.forEach(function(v){set.add(v)});
var b=document.createElement('button'),p=document.createElement('div');
b.className='chip';b.type='button';b.setAttribute('aria-haspopup','true');b.setAttribute('aria-expanded','false');p.className='ddp';p.hidden=true;
function on(v){return set.has(v)}
function txt(){if(set.size===arr.length)return '全部';if(set.size===0)return '未選擇';var a=arr.filter(function(v){return set.has(v)});return a.length<=2?a.join('、'):a.length+' 項'}
function draw(){b.textContent=name+'：'+txt()+' ▾';p.innerHTML='<label><input type="checkbox" data-v="*"'+(set.size===arr.length?' checked':'')+'> 全部</label><hr>'+arr.map(function(v,i){return '<label><input type="checkbox" data-i="'+i+'"'+(on(v)?' checked':'')+'> '+v+'</label>'}).join('')}
p.onchange=function(e){var t=e.target;if(t.dataset.v==='*'){if(t.checked)arr.forEach(function(x){set.add(x)});else set.clear()}else{var v=arr[t.dataset.i];if(t.checked)set.add(v);else set.delete(v)}draw();render()};
function shut(){p.hidden=true;b.setAttribute('aria-expanded','false')}
b.onclick=function(){var o=p.hidden;p.hidden=!o;b.setAttribute('aria-expanded',String(o))};
document.addEventListener('click',function(e){if(!box.contains(e.target))shut()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')shut()});
box.appendChild(b);box.appendChild(p);draw()}
dd($('banks'),'題庫',bs,fb);dd($('types'),'題型',ts,ft);
$('s').oninput=e=>{term=e.target.value.trim();render()};

$('mk').onclick=e=>{fs=!fs;e.target.setAttribute('aria-pressed',fs);render()};
$('rev').onclick=e=>{showA=!showA;e.target.setAttribute('aria-pressed',showA);e.target.textContent='答案：'+(showA?'顯示':'隱藏');render()};
function render(){
const t=term.toLowerCase();updMk();
const r=D.filter(x=>fb.has(x.b)&&ft.has(x.t)&&(!fs||M.has(kk(x)))&&(!t||(x.q+' '+x.a+' '+(x.z||'')).toLowerCase().includes(t)));
$('cnt').textContent='共 '+r.length+' 題';
const L=$('list');
if(!r.length){L.innerHTML='<div class="empty">'+(!fb.size||!ft.size?'尚未選擇題庫或題型，請在上方選單勾選。':'找不到符合的題目，試試其他關鍵字或取消篩選。')+'</div>';return}
L.innerHTML=r.slice(0,200).map(x=>'<div class="card"><button class="star'+(M.has(kk(x))?' on':'')+'" data-k="'+kk(x)+'" onclick="tg(this)" aria-label="標記題目" aria-pressed="'+M.has(kk(x))+'">'+(M.has(kk(x))?'★':'☆')+'</button><div class="tag">'+x.b+'・'+x.t+'・第 '+x.n+' 題</div>'+'<div class="q">'+qh(x.q)+'</div>'+blk('a',showA,(x.t==='複選題'?ml(x.a):x.t==='單選題'?qh(x.a):hl(x.a))+(x.z?'<div class="note">備註：'+hl(x.z)+'</div>':''),'點一下顯示答案')+'</div>').join('')+(r.length>200?'<div class="empty">僅顯示前 200 題，請縮小搜尋範圍。</div>':'');
}
render();
(function(){var r=document.documentElement,b=document.getElementById('th');function cur(){return r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}function lab(){b.textContent=cur()==='dark'?'☀️ 白日':'🌙 深夜'}try{var s=localStorage.getItem('qb_theme');if(s)r.dataset.theme=s}catch(e){}lab();b.onclick=function(){var n=cur()==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('qb_theme',n)}catch(e){}lab()}})();
</script></body></html>
